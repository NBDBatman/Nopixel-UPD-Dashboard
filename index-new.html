<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPD Dashboard — Moved to UPD-OS</title>
<meta name="description" content="The UPD Dashboard is no longer in use. Please use UPD-OS instead.">
<meta name="author" content="MercuryHQ">
<meta name="theme-color" content="#0f1623">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UPD Dashboard">
<meta property="og:image" content="./assets/UPD_Placeholder.webp">
<link rel="icon" href="./assets/UPD_Placeholder.webp" type="image/webp">
<style>
  :root {
    --bg: #0f1623;
    --card: #172133;
    --border: #26324a;
    --text: #e6ebf3;
    --muted: #9aa6bd;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
  }
  .card img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 8px;
  }
  .btn:hover, .btn:focus-visible { background: var(--accent-hover); }
  .url { display: block; margin-top: 16px; font-size: 0.875rem; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<main class="card">
  <img src="./assets/UPD_Placeholder.webp" alt="UPD logo">
  <h1>This dashboard is no longer in use</h1>
  <p>The UPD Dashboard has been retired. All tools and references now live in <strong>UPD-OS</strong>.</p>
  <a class="btn" href="https://upd-os.mercuryhq.xyz/">Go to UPD-OS</a>
  <span class="url">https://upd-os.mercuryhq.xyz/</span>
</main>
</body>
</html>
